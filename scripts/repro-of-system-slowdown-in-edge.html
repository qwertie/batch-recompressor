<!--
Standalone conditional repro: open this file directly in hardware-accelerated
Microsoft Edge, move the mouse when prompted, and keep moving until Done. It
needs no build, packages, server, backend, filesystem/media access, React, or
Batch Recompressor code.

Required condition: Edge's GPU process/graphics driver must already be in the
transient affected state. This occurred with AMD Radeon 8060S driver
32.0.12064.27. A fresh Edge GPU process was often clean, so a clean run does
not disprove the bug. The table is hidden until the first mouse movement.

The non-comment code is the smallest empirically positive reduction reached
before further GUI trials were blocked: a content-sized, collapsed 1,029-row
table; six populated cells; one hidden command tooltip plus copy SVG; an
initial reveal; and Rescan start/completion invalidations. Append #fixed for
the proposed table-layout:fixed control case.

Whitespace and comments are intentionally generous. Only executable/markup
tokens are minimized. The classic script deliberately uses elements' IDs as
window properties: b = button, q = table, t = tbody, and p = output. In the
script, n = counter, m = phase message, P = path prefix, z = delay, and
R = render rows.
-->
<!doctype html>

<style>
  table {
    border-collapse: collapse;
    width: 100%
  }

  td {
    padding: 3px 10px;
    border-bottom: 1px solid #333
  }

  .t > span + span {
    display: none
  }

  svg {
    width: 14px
  }

  .h {
    visibility: hidden
  }

  #p {
    position: fixed;
    top: 0
  }
</style>

<button id=b>Rescan</button>

<table class=h id=q>
  <tbody id=t></tbody>
</table>

<output id=p>Move mouse to start</output>

<script>
  let n = 0,
      m = 'Waiting',
      P = 'D:\\Synthetic\\Pictures\\2023',
      z = x => new Promise(r => setTimeout(r, x)),
      R = () => {
        let s = '';

        for (let i = 0; i < 1029; i++) {
          let f = `${P}\\Folder ${i % 37}\\A deliberately descriptive synthetic filename ${String(i).padStart(4, 0)}.mp4`;

          s += `<tr>
            <td><button>${f}</button></td>
            <td>${10 + i % 900} MB</td>
            <td>
              <span class=t>
                <span>${(1 + i % 30 / 10).toFixed(2)} b/s/px</span>
                <span>
                  <b>Planned FFmpeg command</b>
                  <code>ffmpeg -i "${f}" -c:v libsvtav1 incomplete.output.mkv</code>
                </span>
              </span>
              <button>
                <svg viewBox="0 0 16 16">
                  <path d="M5 1h8v10h-2V3H5V1M2 5h8v10H2z"/>
                </svg>
              </button>
            </td>
            <td>~${2 + i % 80} MB</td>
            <td>notQueued</td>
            <td><button>Exclude</button></td>
          </tr>`
        }

        return s
      };

  t.innerHTML = R();

  if (location.hash)
    q.style.tableLayout = 'fixed';

  setInterval(() => p.textContent = `${m} - tick ${++n}`, 15);

  onmousemove = async () => {
    onmousemove = null;
    q.className = '';
    m = location.hash ? 'Fixed-layout control' : 'Initial paint';
    await z(700);

    for (let i = 1; i < 9; i++) {
      m = `Rescan ${i}/8 start`;
      b.textContent = 'Scanning...';
      await z(400);
      m = `Rescan ${i}/8 completion`;
      t.innerHTML = R();
      b.textContent = 'Rescan';
      await z(700)
    }

    m = 'Done'
  };
</script>
