<!--
Standalone conditional repro: open this file directly in hardware-accelerated
Microsoft Edge, move the mouse when prompted, and keep moving until Done. It
needs no build, packages, server, backend, filesystem/media access, React, or
Batch Recompressor code.

This reduction was directly observed to slow the physical mouse, but later
runs were clean even when the exact backend-free app still failed. It is thus
conditional and does not contain every sufficient condition. The table is
hidden until the first mouse movement. Append #contained to apply the verified
production workaround, contain:layout paint, around the table.

Whitespace and comments are intentionally generous. Only executable/markup
tokens are minimized. The classic script deliberately uses elements' IDs as
window properties: b = button, q = table, t = tbody, w = wrapper, and p = output. In the
script, n = counter, m = phase message, P = path prefix, z = delay, and
R = render rows.
-->
<!doctype html>

<style>
  #s {
    height: 110vh
  }

  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 100%
  }

  td, th {
    padding: 3px 10px;
    border-bottom: 1px solid #333
  }

  .t > span + span {
    display: none
  }

  svg {
    width: 14px
  }

  .h {
    visibility: hidden
  }

  #p {
    position: fixed;
    top: 0;
    width: 320px;
    height: 24px
  }

  #b {
    margin-top: 24px
  }
</style>

<output id=p>Move mouse to start</output>
<button id=b>Rescan</button>
<div id=s></div>

<div id=w><table class=h id=q>
  <thead>
    <tr>
      <th>File</th>
      <th>Size</th>
      <th>Density</th>
      <th>Target</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody id=t></tbody>
</table></div>

<script>
  let n = 0,
      m = 'Waiting',
      P = 'D:\\Synthetic\\Pictures\\2023',
      z = x => new Promise(r => setTimeout(r, x)),
      R = () => {
        let s = '';

        for (let i = 0; i < 1029; i++) {
          let f = `${P}\\Folder ${i % 37}\\A deliberately descriptive synthetic filename ${String(i).padStart(4, 0)}.mp4`;

          s += `<tr>
            <td><button>${f}</button></td>
            <td>${10 + i % 900} MB</td>
            <td>
              <span class=t>
                <span>${(1 + i % 30 / 10).toFixed(2)} b/s/px</span>
                <span>
                  <b>Planned FFmpeg command</b>
                  <code>ffmpeg -i "${f}" -c:v libsvtav1 incomplete.output.mkv</code>
                </span>
              </span>
              <button>
                <svg viewBox="0 0 16 16">
                  <path d="M5 1h8v10h-2V3H5V1M2 5h8v10H2z"/>
                </svg>
              </button>
            </td>
            <td>
              <span class=t>
                <span>~${2 + i % 80} MB</span>
                <span>Target density ${(i % 20 / 10).toFixed(2)}</span>
              </span>
            </td>
            <td>notQueued</td>
            <td><button>Exclude</button></td>
          </tr>`
        }

        return s
      };

  t.innerHTML = R();

  if (location.hash)
    w.style.contain = 'layout paint';

  setInterval(() => p.textContent = `${m} - tick ${++n}`, 15);

  onmousemove = async () => {
    onmousemove = null;
    q.className = '';
    m = location.hash ? 'Contained control' : 'Initial paint';
    await z(700);

    for (let i = 1; i < 4; i++) {
      m = `Rescan ${i}/3 start`;
      b.textContent = 'Scanning...';
      await z(400);
      m = `Rescan ${i}/3 completion`;
      t.innerHTML = R();
      b.textContent = 'Rescan';
      await z(0)
    }

    m = 'Recovery';
    await z(40000);
    m = 'Done'
  };
</script>
